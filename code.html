<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Maintenance System</title>
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #3498db;
            --success: #2ecc71;
            --danger: #e74c3c;
            --warning: #f1c40f;
            --bg: #f8f9fa;
            --text: #333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            padding: 20px;
        }

        header {
            background-color: var(--primary);
            color: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
        }

        .container {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 20px;
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .card h2 {
            margin-bottom: 15px;
            font-size: 1.2rem;
            color: var(--primary);
            border-bottom: 2px solid var(--bg);
            padding-bottom: 5px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 1rem;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: var(--accent);
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #2980b9;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        th {
            background-color: var(--primary);
            color: white;
        }

        tr:hover {
            background-color: #f1f1f1;
        }

        .badge {
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
            color: white;
        }

        .badge-success { background-color: var(--success); }
        .badge-danger { background-color: var(--danger); }

        .btn-delete {
            background-color: var(--danger);
            padding: 5px 10px;
            font-size: 0.8rem;
            width: auto;
            display: inline-block;
        }

        .btn-delete:hover {
            background-color: #c0392b;
        }
    </style>
</head>
<body>

    <header>
        <h1>Stock Maintenance System</h1>
    </header>

    <div class="container">
        <!-- Stock Entry Form -->
        <div class="card">
            <h2>Add / Update Item</h2>
            <form id="stockForm">
                <div class="form-group">
                    <label for="itemCode">Item ID / Code</label>
                    <input type="text" id="itemCode" required placeholder="e.g., ITEM001">
                </div>
                <div class="form-group">
                    <label for="itemName">Item Name</label>
                    <input type="text" id="itemName" required placeholder="e.g., Wireless Mouse">
                </div>
                <div class="form-group">
                    <label for="itemCategory">Category</label>
                    <select id="itemCategory">
                        <option value="Electronics">Electronics</option>
                        <option value="Office Supplies">Office Supplies</option>
                        <option value="Furniture">Furniture</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="itemQty">Quantity</label>
                    <input type="number" id="itemQty" required min="0" placeholder="0">
                </div>
                <button type="submit">Save Stock Item</button>
            </form>
        </div>

        <!-- Stock View Inventory -->
        <div class="card">
            <h2>Current Inventory Records</h2>
            <div style="overflow-x: auto;">
                <table id="inventoryTable">
                    <thead>
                        <tr>
                            <th>Item Code</th>
                            <th>Name</th>
                            <th>Category</th>
                            <th>Qty</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="inventoryBody">
                        <!-- Dynamic items go here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // System Data Initialization
        let inventory = JSON.parse(localStorage.getItem('stock_inventory')) || [];
        const LOW_STOCK_THRESHOLD = 5;

        const stockForm = document.getElementById('stockForm');
        const inventoryBody = document.getElementById('inventoryBody');

        // Render Inventory Table
        function renderTable() {
            inventoryBody.innerHTML = '';
            
            if(inventory.length === 0) {
                inventoryBody.innerHTML = `<tr><td colspan="6" style="text-align:center;">No stock records available.</td></tr>`;
                return;
            }

            inventory.forEach((item, index) => {
                const isLow = item.qty <= LOW_STOCK_THRESHOLD;
                const statusBadge = isLow 
                    ? `<span class="badge badge-danger">Low Stock</span>` 
                    : `<span class="badge badge-success">In Stock</span>`;

                const row = document.createElement('tr');
                row.innerHTML = `
                    <td><strong>${item.code}</strong></td>
                    <td>${item.name}</td>
                    <td>${item.category}</td>
                    <td>${item.qty}</td>
                    <td>${statusBadge}</td>
                    <td><button class="btn-delete" onclick="deleteItem(${index})">Remove</button></td>
                `;
                inventoryBody.appendChild(row);
            });
        }

        // Add or Update Items
        stockForm.addEventListener('submit', function(e) {
            e.preventDefault();

            const code = document.getElementById('itemCode').value.trim();
            const name = document.getElementById('itemName').value.trim();
            const category = document.getElementById('itemCategory').value;
            const qty = parseInt(document.getElementById('itemQty').value);

            // Check if item code already exists
            const existingItemIndex = inventory.findIndex(item => item.code.toLowerCase() === code.toLowerCase());

            if (existingItemIndex > -1) {
                // Update quantity of existing item
                inventory[existingItemIndex].qty = qty;
                inventory[existingItemIndex].name = name;
                inventory[existingItemIndex].category = category;
            } else {
                // Push new item record
                inventory.push({ code, name, category, qty });
            }

            // Sync with browser LocalStorage and re-render
            localStorage.setItem('stock_inventory', JSON.stringify(inventory));
            renderTable();
            stockForm.reset();
        });

        // Delete Stock Items
        window.deleteItem = function(index) {
            if(confirm("Are you sure you want to remove this stock item?")) {
                inventory.splice(index, 1);
                localStorage.setItem('stock_inventory', JSON.stringify(inventory));
                renderTable();
            }
        }

        // Initialize display on load
        renderTable();
    </script>
</body>
</html>
